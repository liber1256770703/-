<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青岛大学2026新生指南</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1E40AF;--accent:#3B82F6;--bg:#F8FAFC;--card:#FFFFFF;--text:#1E293B;--text-light:#64748B;--border:#E2E8F0;--shadow:0 4px 24px rgba(0,0,0,0.06);--shadow-hover:0 8px 32px rgba(0,0,0,0.12);--radius:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}

/* 顶部导航 */
.topbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:1000;display:flex;align-items:center;padding:0 24px;justify-content:space-between;transition:all .3s}
.topbar .logo{font-size:18px;font-weight:800;color:var(--primary);cursor:pointer;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.topbar .logo span{font-size:12px;font-weight:400;color:var(--text-light);letter-spacing:0}
.topbar .menu-btn{padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.topbar .menu-btn:hover{background:var(--accent);transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,130,246,0.3)}

/* 页面容器 */
.page{display:none;min-height:100vh;padding:88px 24px 48px;animation:fadeIn .4s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* 面包屑导航 */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:24px;font-size:13px;color:var(--text-light);flex-wrap:wrap}
.breadcrumb a{color:var(--accent);cursor:pointer;text-decoration:none;transition:color .2s}
.breadcrumb a:hover{color:var(--primary);text-decoration:underline}
.breadcrumb .sep{color:var(--border);font-size:10px}

/* === 首页 === */
#page-home{max-width:960px;margin:0 auto}
.hero{text-align:center;padding:60px 20px 48px;background:linear-gradient(135deg,#1E40AF 0%,#3B82F6 50%,#06B6D4 100%);border-radius:24px;color:#fff;margin-bottom:48px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:rgba(255,255,255,0.08);border-radius:50%}
.hero::after{content:"";position:absolute;bottom:-30%;left:-10%;width:300px;height:300px;background:rgba(255,255,255,0.06);border-radius:50%}
.hero h1{font-size:38px;font-weight:800;letter-spacing:4px;position:relative;z-index:1}
.hero .motto{font-size:16px;opacity:.9;margin-top:16px;letter-spacing:6px;position:relative;z-index:1}
.hero .sub{font-size:13px;opacity:.7;margin-top:12px;position:relative;z-index:1}

.section-label{font-size:14px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:2px;margin-bottom:20px;padding-left:4px}

/* 主题卡片网格 */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:40px}
.topic-card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);border:1px solid var(--border);position:relative}
.topic-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover)}
.topic-card .card-img{width:100%;height:160px;object-fit:cover;background:#f0f0f0}
.topic-card .card-body{padding:20px}
.topic-card .card-num{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:2px}
.topic-card .card-title{font-size:18px;font-weight:700;margin:6px 0 8px;color:var(--text)}
.topic-card .card-sub{font-size:13px;color:var(--text-light)}
.topic-card .card-arrow{position:absolute;bottom:20px;right:20px;width:32px;height:32px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;opacity:0;transform:translateX(-8px);transition:all .3s}
.topic-card:hover .card-arrow{opacity:1;transform:translateX(0)}
.topic-card .card-bar{height:4px;background:var(--accent);width:0;transition:width .35s}
.topic-card:hover .card-bar{width:100%}

/* === 主题页（二级标题列表）=== */
#page-topic{max-width:800px;margin:0 auto}
.topic-header{text-align:center;margin-bottom:40px}
.topic-header .topic-num{font-size:14px;font-weight:800;letter-spacing:4px;margin-bottom:8px}
.topic-header h2{font-size:32px;font-weight:800;margin-bottom:8px}
.topic-header .topic-sub{font-size:14px;color:var(--text-light)}
.topic-hero-img{width:100%;max-width:680px;height:300px;object-fit:cover;border-radius:20px;margin:0 auto 40px;display:block;box-shadow:var(--shadow)}

.section-list{display:flex;flex-direction:column;gap:16px}
.section-item{background:var(--card);border-radius:14px;padding:24px 28px;cursor:pointer;transition:all .3s;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.section-item:hover{transform:translateX(6px);box-shadow:var(--shadow);border-color:var(--accent)}
.section-item .sec-num{font-size:13px;font-weight:800;color:#fff;background:var(--accent);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-item .sec-title{font-size:16px;font-weight:600;margin-left:16px;flex:1}
.section-item .sec-icon{color:var(--text-light);font-size:18px;transition:transform .3s}
.section-item:hover .sec-icon{transform:translateX(4px);color:var(--accent)}

/* === 详情页（三级标题+正文）=== */
#page-detail{max-width:760px;margin:0 auto}
.detail-header{margin-bottom:32px}
.detail-header h3{font-size:26px;font-weight:800;color:var(--text);margin-bottom:8px}
.detail-header .detail-sub{font-size:13px;color:var(--text-light)}

.detail-content{background:var(--card);border-radius:var(--radius);padding:36px 40px;box-shadow:var(--shadow);border:1px solid var(--border)}
.detail-content > * + *{margin-top:20px}
.detail-content h4{font-size:16px;font-weight:700;color:var(--primary);margin-top:28px;padding-bottom:8px;border-bottom:2px solid var(--border)}
.detail-content h4:first-child{margin-top:0}

/* 正文段落 */
.d-text{font-size:15px;color:var(--text);line-height:1.8}

/* 表格 */
.d-table{width:100%;border-collapse:collapse;font-size:13px;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.d-table th{background:var(--primary);color:#fff;padding:10px 14px;text-align:left;font-weight:600;font-size:13px}
.d-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text)}
.d-table tr:nth-child(even) td{background:#F8FAFC}
.d-table tr:last-child td{border-bottom:none}
.d-table tr:hover td{background:#EFF6FF}

/* 提示框 */
.d-tip{padding:14px 18px;border-radius:10px;font-size:14px;line-height:1.7;border-left:4px solid}
.d-tip.tip{background:#FFF8E1;border-color:#F59E0B;color:#92400E}
.d-tip.warn{background:#FFEBEE;border-color:#EF4444;color:#991B1B}
.d-tip.good{background:#E8F5E9;border-color:#10B981;color:#065F46}

/* FAQ */
.d-faq{background:#F8FAFC;border-radius:12px;padding:16px 20px;border:1px solid var(--border)}
.d-faq .q{font-weight:700;color:var(--primary);font-size:15px;margin-bottom:6px}
.d-faq .q::before{content:"Q ";color:var(--accent);font-size:16px}
.d-faq .a{font-size:14px;color:var(--text);line-height:1.7}
.d-faq .a::before{content:"A ";color:var(--text-light);font-size:14px}

/* 返回按钮 - 顶部固定 */
.nav-buttons{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:24px}
.nav-btn{padding:8px 20px;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .25s;display:inline-flex;align-items:center;gap:6px}
.nav-btn.back{background:var(--card);color:var(--text);border:1px solid var(--border)}
.nav-btn.back:hover{border-color:var(--accent);color:var(--accent);transform:translateX(-4px)}
.nav-btn.menu{background:var(--primary);color:#fff}
.nav-btn.menu:hover{background:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(30,64,175,0.3)}

/* 制作者信息 */
.creator-info{text-align:center;padding:20px;background:linear-gradient(135deg,#F0F7FF 0%,#E0F0FF 100%);border-radius:16px;margin-bottom:32px;border:1px solid #B3D9FF}
.creator-info p{font-size:14px;color:#1E40AF;line-height:2;margin:0}
.creator-info .qq-num{font-weight:800;font-size:16px;color:#DC2626;letter-spacing:1px}

/* 底部 */
.footer{text-align:center;padding:48px 20px 32px;color:var(--text-light);font-size:12px}
.footer hr{border:none;border-top:1px solid var(--border);margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto}

/* 滚动动画 */
.scroll-top{position:fixed;bottom:32px;right:32px;width:48px;height:48px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;opacity:0;transform:translateY(20px);transition:all .3s;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.scroll-top.show{opacity:1;transform:translateY(0)}
.scroll-top:hover{background:var(--accent);transform:translateY(-4px)}

@media(max-width:640px){
  .hero h1{font-size:26px}
  .topic-grid{grid-template-columns:1fr}
  .detail-content{padding:24px 20px}
  .topbar .logo span{display:none}
}
</style>
</head>

var currentTopic = null;
var currentSection = null;

// === 渲染首页 ===
function renderHome() {
  var grid = document.getElementById('topic-grid');
  var html = '';
  TOPICS.forEach(function(t) {
    var imgSrc = t.image ? IMG[t.image] : '';
    var imgHtml = imgSrc
      ? '<img class="card-img" src="' + imgSrc + '">'
      : '<div class="card-img" style="display:flex;align-items:center;justify-content:center;font-size:48px;background:' + t.color + '22">📋</div>';
    html += '<div class="topic-card" data-topic="' + t.id + '" style="border-color:' + t.color + '22">' +
      imgHtml +
      '<div class="card-body">' +
        '<div class="card-num" style="color:' + t.color + '">' + t.num + '</div>' +
        '<div class="card-title">' + t.title + '</div>' +
        '<div class="card-sub">' + t.subtitle + '</div>' +
      '</div>' +
      '<div class="card-arrow" style="background:' + t.color + '">→</div>' +
      '<div class="card-bar" style="background:' + t.color + '"></div>' +
    '</div>';
  });
  grid.innerHTML = html;
}

// === 跳转首页 ===
function goHome() {
  showPage('page-home');
  window.scrollTo(0, 0);
}

// === 跳转主题页（二级标题列表）===
function goTopic(topicId) {
  currentTopic = TOPICS.find(function(t) { return t.id === topicId; });
  if (!currentTopic) return;
  var t = currentTopic;
  var imgSrc = t.image ? IMG[t.image] : '';
  var imgHtml = imgSrc ? '<img class="topic-hero-img" src="' + imgSrc + '" style="border-color:' + t.color + '33">' : '';

  var sectionsHtml = '';
  t.sections.forEach(function(s, i) {
    sectionsHtml += '<div class="section-item" data-section="' + i + '" style="border-color:' + t.color + '22">' +
      '<div class="sec-num" style="background:' + t.color + '">' + (i+1) + '</div>' +
      '<div class="sec-title">' + s.title + '</div>' +
      '<div class="sec-icon">›</div>' +
    '</div>';
  });

  document.getElementById('topic-content').innerHTML =
    '<div style="max-width:800px;margin:0 auto">' +
      '<div class="nav-buttons">' +
        '<button class="nav-btn back" data-action="home">← 返回主菜单</button>' +
        '<button class="nav-btn menu" data-action="home">📋 主菜单</button>' +
      '</div>' +
      '<div class="breadcrumb">' +
        '<a data-action="home">主菜单</a>' +
        '<span class="sep">/</span>' +
        '<span style="color:' + t.color + ';font-weight:600">' + t.title + '</span>' +
      '</div>' +
      '<div class="topic-header">' +
        '<div class="topic-num" style="color:' + t.color + '">TOPIC ' + t.num + '</div>' +
        '<h2>' + t.title + '</h2>' +
        '<div class="topic-sub">' + t.subtitle + '</div>' +
      '</div>' +
      imgHtml +
      '<div class="section-list">' + sectionsHtml + '</div>' +
      '<div class="nav-buttons" style="margin-top:20px">' +
        '<button class="nav-btn back" data-action="home">← 返回主菜单</button>' +
        '<button class="nav-btn menu" data-action="home">📋 主菜单</button>' +
      '</div>' +
      '<div style="height:40px"></div>' +
    '</div>';

  showPage('page-topic');
  window.scrollTo(0, 0);
}

// === 跳转详情页（三级标题+正文）===
function goDetail(sectionIdx) {
  currentSection = currentTopic.sections[sectionIdx];
  if (!currentSection) return;
  var t = currentTopic;
  var s = currentSection;

  var contentHtml = '';
  s.items.forEach(function(item) {
    if (item.type === 'text') {
      contentHtml += '<div class="d-text">' + item.content + '</div>';
    } else if (item.type === 'table') {
      var tableHtml = '<table class="d-table"><thead><tr>';
      item.headers.forEach(function(h) { tableHtml += '<th>' + h + '</th>'; });
      tableHtml += '</tr></thead><tbody>';
      item.rows.forEach(function(row) {
        tableHtml += '<tr>';
        row.forEach(function(cell) { tableHtml += '<td>' + cell + '</td>'; });
        tableHtml += '</tr>';
      });
      tableHtml += '</tbody></table>';
      contentHtml += tableHtml;
    } else if (item.type === 'tip') {
      contentHtml += '<div class="d-tip ' + item.style + '">' + item.content + '</div>';
    } else if (item.type === 'faq') {
      item.qa.forEach(function(qa) {
        contentHtml += '<div class="d-faq" style="margin-bottom:12px"><div class="q">' + qa[0] + '</div><div class="a">' + qa[1] + '</div></div>';
      });
    }
  });

  document.getElementById('detail-content').innerHTML =
    '<div style="max-width:760px;margin:0 auto">' +
      '<div class="nav-buttons">' +
        '<button class="nav-btn back" data-topic="' + t.id + '">← 返回' + t.title + '</button>' +
        '<button class="nav-btn menu" data-action="home">📋 一键回主菜单</button>' +
      '</div>' +
      '<div class="breadcrumb">' +
        '<a data-action="home">主菜单</a>' +
        '<span class="sep">/</span>' +
        '<a data-topic="' + t.id + '">' + t.title + '</a>' +
        '<span class="sep">/</span>' +
        '<span style="color:' + t.color + ';font-weight:600">' + s.title + '</span>' +
      '</div>' +
      '<div class="detail-header">' +
        '<h3>' + s.title + '</h3>' +
        '<div class="detail-sub">属于「' + t.title + '」| ' + t.subtitle + '</div>' +
      '</div>' +
      '<div class="detail-content" style="border-color:' + t.color + '22">' + contentHtml + '</div>' +
      '<div class="nav-buttons" style="margin-top:20px">' +
        '<button class="nav-btn back" data-topic="' + t.id + '">← 返回' + t.title + '</button>' +
        '<button class="nav-btn menu" data-action="home">📋 一键回主菜单</button>' +
      '</div>' +
      '<div style="height:40px"></div>' +
    '</div>';

  showPage('page-detail');
  window.scrollTo(0, 0);
}

// === 页面切换 ===
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(pageId).classList.add('active');
}

// === 事件委托：统一处理所有点击 ===
document.addEventListener('click', function(e) {
  // 向上查找带 data-topic / data-section / data-action 的元素
  var el = e.target;
  while (el && el !== document) {
    if (el.dataset.topic) {
      goTopic(el.dataset.topic);
      return;
    }
    if (el.dataset.section !== undefined) {
      goDetail(parseInt(el.dataset.section));
      return;
    }
    if (el.dataset.action === 'home') {
      goHome();
      return;
    }
    el = el.parentElement;
  }
});

// === 滚动监听 ===
window.addEventListener('scroll', function() {
  var st = document.getElementById('scrollTop');
  if (window.scrollY > 300) { st.classList.add('show'); }
  else { st.classList.remove('show'); }
});

// === 初始化 ===
renderHome();
</script>
